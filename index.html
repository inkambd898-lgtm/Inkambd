<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkamBD | Service Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #6c5ce7; --bg: #0f0c29; --card: rgba(255, 255, 255, 0.08); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .notice-card { background: var(--card); padding: 30px; border-radius: 25px; max-width: 400px; width: 90%; text-align: center; border: 1px solid rgba(108, 92, 231, 0.3); backdrop-filter: blur(10px); }
        .brand { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #6c5ce7, #00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .status-tag { background: #ff7675; color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; }
        .info-box { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px; margin: 20px 0; border-left: 4px solid #6c5ce7; text-align: left; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; text-decoration: none; color: white; }
        .btn-report { background: #d63031; }
        .btn-ref { background: #00b894; }
        .ref-box { font-size: 11px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin-top: 5px; word-break: break-all; color: #a29bfe; }
    </style>
</head>
<body>

    <div class="notice-card">
        <div class="brand">InkamBD</div>
        <span class="status-tag">সার্ভিস বন্ধ</span>
        
        <div class="info-box">
            <p style="margin:0; font-size: 14px; line-height: 1.6;">
                কারিগরি ত্রুটির কারণে বর্তমানে সকল কাজ <b>অনির্দিষ্টকালের জন্য</b> বন্ধ ঘোষণা করা হয়েছে। তবে আপনার <b>রেফার ইনকাম</b> চালু থাকবে।
            </p>
        </div>

        <div style="margin-bottom: 20px;">
            <p style="font-size: 13px; margin-bottom: 5px;"><i class="fas fa-share-nodes"></i> আপনার রেফার লিংক:</p>
            <div class="ref-box" id="refLink">লোডিং...</div>
            <button class="btn btn-ref" onclick="copyRef()">
                <i class="fas fa-copy"></i> লিংক কপি করুন
            </button>
        </div>

        <hr style="opacity: 0.1;">

        <a href="https://otieu.com/4/10451417" class="btn btn-report">
            <i class="fas fa-bug"></i> রিপোর্ট করুন
        </a>

        <p style="font-size: 11px; color: #636e72; margin-top: 15px;">পরবর্তী আপডেট পেতে আমাদের সাথেই থাকুন।</p>
    </div>

    <script>
        // ইউজার আইডি সেটআপ
        let userId = localStorage.getItem('user_id') || 'U' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('user_id', userId);

        // রেফার লিংক জেনারেট
        function setRef() {
            let link = window.location.origin + window.location.pathname + "?ref=" + userId;
            document.getElementById('refLink').innerText = link;
        }

        function copyRef() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link).then(() => alert("রেফার লিংক কপি হয়েছে!"));
        }

        window.onload = setRef;
    </script>

</body>
</html>
